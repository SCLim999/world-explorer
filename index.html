<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环游世界 World Explorer</title>
<style>
  :root{
    --sky:#eaf4ff; --card:#ffffff; --ink:#1f3b57; --ink2:#5b7a96;
    --blue:#3d8bfd; --green:#3ec46d; --yellow:#ffc93c; --pink:#ff7eb6; --orange:#ff9a3c;
    --shadow:0 6px 0 rgba(31,59,87,.12), 0 12px 24px rgba(31,59,87,.10);
    --radius:22px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Comic Sans MS","Segoe UI Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#dff0ff 0%,#eaf7ff 40%,#fff6e6 100%);
    min-height:100vh; padding:14px;
  }
  /* ---------- language switching ---------- */
  .zh,.en{display:inline}
  body.only-zh .en{display:none}
  body.only-en .zh{display:none}
  body.both .zh+.en:before{content:" "}
  .stack .zh,.stack .en{display:block}

  header{
    max-width:1180px;margin:0 auto 14px;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  h1{font-size:26px;margin:0;line-height:1.2}
  h1 .en{font-size:18px;color:var(--ink2)}
  .grow{flex:1}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{
    background:#f0f6ff;border:3px solid #d7e7ff;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:bold;
    color:var(--ink); transition:transform .12s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.big{font-size:18px;padding:12px 22px;background:var(--yellow);border-color:#f0b21f}
  .seg{display:flex;gap:6px;background:#f4f8ff;padding:5px;border-radius:999px}

  main{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:16px}
  @media (max-width:880px){main{grid-template-columns:1fr}}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}

  /* ---------- globe ---------- */
  #globeWrap{position:relative;display:flex;flex-direction:column;align-items:center}
  canvas{width:100%;max-width:460px;aspect-ratio:1;touch-action:none;cursor:grab;border-radius:50%}
  canvas:active{cursor:grabbing}
  .hint{font-size:14px;color:var(--ink2);margin-top:8px;text-align:center}
  .globeTools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}

  /* ---------- country card ---------- */
  .flagBox{width:132px;height:88px;border-radius:10px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.25);flex:none}
  .flagBox svg{display:block;width:100%;height:100%}
  .cardTop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .cName{font-size:30px;font-weight:bold;line-height:1.15}
  .cName .en{font-size:20px;color:var(--ink2)}
  .meta{margin-top:6px;font-size:16px;color:var(--ink2)}
  .facts{list-style:none;padding:0;margin:14px 0 0}
  .facts li{background:#f5faff;border-radius:16px;padding:10px 14px;margin-bottom:8px;font-size:17px;display:flex;gap:10px;align-items:flex-start}
  .facts li .emo{font-size:22px}
  .hello{margin-top:12px;background:linear-gradient(90deg,#fff3d6,#ffe9f4);border-radius:16px;padding:12px 14px;font-size:18px}
  .hello b{font-size:22px}
  .navRow{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .trio button{background:#f7fbff;border:3px solid #e3eefb;border-radius:18px;padding:10px 6px;transition:transform .12s}
  .trio button:hover{transform:translateY(-3px);border-color:var(--blue)}
  .trio .pic{width:100%;max-width:78px;margin:0 auto;display:block}
  .trio .emo{font-size:46px;line-height:1.35;text-align:center}
  .trio .lbl{font-size:11px;color:var(--ink2);font-weight:bold;text-align:center}
  .trio .nm{font-size:14px;font-weight:bold;line-height:1.2;margin-top:3px;text-align:center}
  .trio .nm .en{font-size:11.5px;color:var(--ink2)}

  /* ---------- picker ---------- */
  .picker{max-width:1180px;margin:16px auto 0}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .cbtn{background:#fff;border:3px solid #e6eefb;border-radius:16px;padding:8px;text-align:center;box-shadow:0 3px 0 rgba(31,59,87,.08);transition:transform .12s}
  .cbtn:hover{transform:translateY(-3px);border-color:var(--blue)}
  .cbtn.on{border-color:var(--orange);background:#fff8ec}
  .cbtn svg{width:100%;height:auto;aspect-ratio:3/2;border-radius:6px;display:block;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .cbtn span{display:block;font-size:14px;font-weight:bold;margin-top:6px;line-height:1.25}
  .cbtn .en{font-size:12px;color:var(--ink2)}

  /* ---------- modes ---------- */
  #stage,#picker,#quiz,#animal,#passport{display:none}
  body.m-learn #stage,body.m-hunt #stage{display:grid}
  body.m-learn #picker{display:block}
  body.m-quiz #quiz{display:block}
  body.m-animal #animal{display:block}
  body.m-passport #passport{display:block}
  #card,#huntPanel{display:none}
  body.m-learn #card{display:block}
  body.m-hunt #huntPanel{display:block}
  body.m-hunt #findBtn{display:none}
  .navbar{display:flex;gap:6px;flex-wrap:wrap}
  .navbar .btn.on{background:var(--orange);border-color:#e07f1f;color:#fff}
  #ppCount{background:rgba(255,255,255,.7);border-radius:999px;padding:1px 7px;font-size:13px;margin-left:2px}

  /* ---------- hunt ---------- */
  .huntQ{font-size:24px;font-weight:bold;text-align:center;line-height:1.25}
  .huntQ .en{font-size:19px;color:var(--ink2)}
  .huntFlag{width:120px;margin:12px auto;display:block;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
  .hintBox{background:#fff7e6;border-radius:16px;padding:14px;margin-top:12px;font-size:17px;min-height:56px;text-align:center;line-height:1.4}
  .hintBox.good{background:#eefbf2}

  /* ---------- animal match ---------- */
  .matchWrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .col{display:flex;flex-direction:column;gap:10px}
  .mcard{background:#fff;border:4px solid #e6eefb;border-radius:18px;padding:10px;box-shadow:0 3px 0 rgba(31,59,87,.08);display:flex;align-items:center;gap:10px;justify-content:center;min-height:66px;transition:transform .12s,opacity .3s}
  .mcard:hover{transform:translateY(-2px)}
  .mcard.sel{border-color:var(--blue);background:#eef5ff}
  .mcard.done{opacity:.3;pointer-events:none;border-color:var(--green)}
  .mcard.shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .mcard .ani{font-size:36px;line-height:1}
  .mcard svg{width:54px;height:36px;border-radius:4px;flex:none;box-shadow:0 2px 5px rgba(0,0,0,.2)}
  .mcard span{font-size:14px;font-weight:bold;line-height:1.2}

  /* ---------- passport ---------- */
  .pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin-top:14px}
  .slot{border:3px dashed #d5e3f5;border-radius:16px;padding:10px;text-align:center;min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fbfdff}
  .slot.got{border-style:solid;border-color:#f0c98a;background:#fffaf0}
  .slot .q{font-size:36px;color:#cddcee}
  .stampImg{position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
  .stampImg .ring{position:absolute;inset:0;border:3px solid #d2544e;border-radius:50%;transform:rotate(-12deg);opacity:.8}
  .stampImg svg{width:44px;height:30px;border-radius:3px;transform:rotate(-12deg)}
  .slot .nm{font-size:13px;font-weight:bold;line-height:1.25}
  .bar{height:18px;background:#eaf1fb;border-radius:999px;overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width .5s}
  .cert{margin-top:14px;border:5px double #e0a93c;border-radius:18px;background:linear-gradient(180deg,#fffdf5,#fff6e0);padding:18px;text-align:center}
  .cert .big{font-size:40px}
  .cert .t{font-size:22px;font-weight:bold;margin-top:6px}
  #stampFx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:70}
  #stampFx.show{display:flex}
  #stampFx .big{width:206px;height:206px;border-radius:50%;border:6px solid #d2544e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(0,0,0,.28);animation:thump .8s ease-out}
  #stampFx .big svg{width:90px;height:60px;border-radius:5px}
  #stampFx .big .t{color:#d2544e;font-weight:bold;font-size:17px;text-align:center;padding:0 14px;line-height:1.2}
  @keyframes thump{0%{transform:scale(3.2) rotate(-28deg);opacity:0}55%{transform:scale(.94) rotate(-12deg);opacity:1}72%{transform:scale(1.07) rotate(-12deg)}100%{transform:scale(1) rotate(-12deg);opacity:1}}

  /* ---------- quiz ---------- */
  .qHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .qTitle{font-size:24px;font-weight:bold}
  .qOpts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
  .qOpt{background:#fff;border:4px solid #e6eefb;border-radius:18px;padding:10px;box-shadow:var(--shadow)}
  .qOpt svg{width:100%;height:auto;aspect-ratio:3/2;border-radius:8px;display:block}
  .qOpt span{display:block;margin-top:8px;font-size:16px;font-weight:bold}
  .qOpt.right{border-color:var(--green);background:#eefbf2}
  .qOpt.wrong{border-color:#ff6b6b;background:#fff0f0;opacity:.7}
  .score{font-size:20px;font-weight:bold}
  .bigMsg{font-size:22px;text-align:center;padding:20px}
  #confetti{position:fixed;inset:0;pointer-events:none;display:none;z-index:65}
  footer{max-width:1180px;margin:18px auto 6px;text-align:center;color:var(--ink2);font-size:14px}
</style>
</head>
<body class="both">

<header>
  <div>
    <h1 class="stack"><span class="zh">🌍 环游世界小课堂</span><span class="en">🌍 World Explorer for Kids</span></h1>
  </div>
  <div class="grow"></div>
  <div class="seg" id="langSeg">
    <button class="btn on" data-lang="both">中 + EN</button>
    <button class="btn" data-lang="zh">中文</button>
    <button class="btn" data-lang="en">English</button>
  </div>
  <div class="navbar" id="modeNav">
    <button class="btn on" data-m="learn">📚 <span class="zh">学习</span><span class="en">Learn</span></button>
    <button class="btn" data-m="hunt">🎯 <span class="zh">寻宝</span><span class="en">Hunt</span></button>
    <button class="btn" data-m="animal">🐾 <span class="zh">动物找家</span><span class="en">Animals</span></button>
    <button class="btn" data-m="quiz">🚩 <span class="zh">国旗</span><span class="en">Flags</span></button>
    <button class="btn" data-m="passport">🛂 <span class="zh">护照</span><span class="en">Passport</span><b id="ppCount">0/24</b></button>
    <button class="btn on" id="spkBtn">🔊 <span class="zh">朗读</span><span class="en">Voice</span></button>
  </div>
</header>

<main id="stage">
  <section class="panel" id="globeWrap">
    <canvas id="globe"></canvas>
    <div class="globeTools">
      <button class="btn" id="spinBtn">⏸ <span class="zh">暂停转动</span><span class="en">Pause</span></button>
      <button class="btn" id="findBtn">🎯 <span class="zh">飞到这个国家</span><span class="en">Fly there</span></button>
    </div>
    <p class="hint stack">
      <span class="zh">用手指或鼠标拖动地球，转一转看看！点亮的小圆点就是国家。</span>
      <span class="en">Drag the globe to spin it! Tap a glowing dot to visit a country.</span>
    </p>
  </section>

  <section class="panel">
    <div id="card"></div>
    <div id="huntPanel"></div>
  </section>
</main>

<section class="picker panel" id="picker">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</section>

<div id="quiz" class="picker panel"></div>
<div id="animal" class="picker panel"></div>
<div id="passport" class="picker panel"></div>

<canvas id="confetti"></canvas>
<div id="stampFx"></div>

<footer class="stack">
  <span class="zh">一年级小朋友的世界地理小课堂 · 24 个国家 · 一起认识地球上的朋友吧！</span>
  <span class="en">Grade 1 geography · 24 countries · Let's meet our friends on Earth!</span>
</footer>

<script>
/* ============================================================
   1. FLAG DRAWINGS (simple SVG, no internet needed)
   ============================================================ */
function starPts(cx,cy,r,rot){
  rot = rot===undefined ? -90 : rot;
  var p=[];
  for(var i=0;i<10;i++){
    var a=(rot+i*36)*Math.PI/180, rr = (i%2)? r*0.382 : r;
    p.push((cx+rr*Math.cos(a)).toFixed(2)+','+(cy+rr*Math.sin(a)).toFixed(2));
  }
  return p.join(' ');
}
function star(cx,cy,r,fill,rot){return '<polygon points="'+starPts(cx,cy,r,rot)+'" fill="'+(fill||'#fff')+'"/>';}
function hbands(cols){var s='',h=40/cols.length;cols.forEach(function(c,i){s+='<rect y="'+(i*h)+'" width="60" height="'+(h+0.3)+'" fill="'+c+'"/>';});return s;}
function vbands(cols){var s='',w=60/cols.length;cols.forEach(function(c,i){s+='<rect x="'+(i*w)+'" width="'+(w+0.3)+'" height="40" fill="'+c+'"/>';});return s;}
var UJ='<rect width="60" height="40" fill="#012169"/>'+
  '<path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="9"/>'+
  '<path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="4.5"/>'+
  '<path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="13"/>'+
  '<path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7.5"/>';
var CANTON_UJ='<svg x="0" y="0" width="30" height="20" viewBox="0 0 60 40">'+UJ+'</svg>';

var FLAGS={
  cn:function(){return '<rect width="60" height="40" fill="#EE1C25"/>'+star(11,10,6.5,'#FFDE00')+
      star(21,4,2.2,'#FFDE00')+star(25.5,8.5,2.2,'#FFDE00')+star(25.5,14.5,2.2,'#FFDE00')+star(21,19,2.2,'#FFDE00');},
  jp:function(){return '<rect width="60" height="40" fill="#fff"/><circle cx="30" cy="20" r="11" fill="#BC002D"/>';},
  my:function(){var s='';for(var i=0;i<14;i++)s+='<rect y="'+(i*40/14)+'" width="60" height="'+(40/14+0.3)+'" fill="'+(i%2?'#fff':'#CC0001')+'"/>';
      s+='<rect width="34" height="'+(40/14*8)+'" fill="#010066"/>';
      s+='<circle cx="13" cy="11" r="6.4" fill="#FFCC00"/><circle cx="15.8" cy="11" r="5.4" fill="#010066"/>';
      s+=star(25,11,5,'#FFCC00');return s;},
  sg:function(){var s='<rect width="60" height="40" fill="#fff"/><rect width="60" height="20" fill="#ED2939"/>'+
      '<circle cx="12" cy="10" r="6" fill="#fff"/><circle cx="14.6" cy="10" r="5" fill="#ED2939"/>';
      for(var i=0;i<5;i++){var a=(-90+i*72)*Math.PI/180;s+=star(23+4.6*Math.cos(a),10+4.6*Math.sin(a),1.9,'#fff');}
      return s;},
  us:function(){var s='';for(var i=0;i<13;i++)s+='<rect y="'+(i*40/13)+'" width="60" height="'+(40/13+0.3)+'" fill="'+(i%2?'#fff':'#B22234')+'"/>';
      s+='<rect width="24" height="21.6" fill="#3C3B6E"/>';
      for(var r=0;r<5;r++)for(var c=0;c<6;c++)s+='<circle cx="'+(2.6+c*3.8)+'" cy="'+(2.6+r*4.2)+'" r="1.05" fill="#fff"/>';
      return s;},
  gb:function(){return UJ;},
  fr:function(){return vbands(['#002395','#ffffff','#ED2939']);},
  it:function(){return vbands(['#009246','#ffffff','#CE2B37']);},
  de:function(){return hbands(['#000000','#DD0000','#FFCE00']);},
  ru:function(){return hbands(['#ffffff','#0039A6','#D52B1E']);},
  es:function(){return '<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/>'+
      '<rect x="13" y="15" width="9" height="11" rx="1.5" fill="#AA151B"/><rect x="14.5" y="16.5" width="6" height="8" rx="1" fill="#F1BF00"/>';},
  eg:function(){return hbands(['#CE1126','#ffffff','#000000'])+'<circle cx="30" cy="20" r="3.4" fill="#C09300"/>'+
      '<polygon points="30,14.5 33,19 27,19" fill="#C09300"/>';},
  ke:function(){return '<rect width="60" height="40" fill="#fff"/><rect width="60" height="12" fill="#000"/>'+
      '<rect y="14" width="60" height="12" fill="#BB0000"/><rect y="28" width="60" height="12" fill="#006600"/>'+
      '<ellipse cx="30" cy="20" rx="5" ry="9" fill="#fff"/><ellipse cx="30" cy="20" rx="3.2" ry="7" fill="#BB0000"/>'+
      '<rect x="29.2" y="7" width="1.6" height="26" fill="#000" opacity=".55"/>';},
  br:function(){return '<rect width="60" height="40" fill="#009739"/><polygon points="30,4 56,20 30,36 4,20" fill="#FEDD00"/>'+
      '<circle cx="30" cy="20" r="8.5" fill="#012169"/><path d="M22,18 Q30,25 38,18" stroke="#fff" stroke-width="2.6" fill="none"/>'+
      star(27,16,1.1,'#fff')+star(33,17,1,'#fff')+star(30,22.5,0.9,'#fff');},
  au:function(){return '<rect width="60" height="40" fill="#00247D"/>'+CANTON_UJ+star(14,31,4,'#fff')+
      star(46,9,2.4,'#fff')+star(52,20,2,'#fff')+star(45,31,2.4,'#fff')+star(39,19,1.9,'#fff')+star(49,26,1.3,'#fff');},
  in:function(){return hbands(['#FF9933','#ffffff','#138808'])+
      '<circle cx="30" cy="20" r="5" fill="none" stroke="#000080" stroke-width="1.4"/>'+
      '<circle cx="30" cy="20" r="1" fill="#000080"/>'+
      '<path d="M30,15 V25 M25,20 H35 M26.5,16.5 L33.5,23.5 M33.5,16.5 L26.5,23.5" stroke="#000080" stroke-width="0.7"/>';},
  ca:function(){return '<rect width="60" height="40" fill="#fff"/><rect width="15" height="40" fill="#D52B1E"/>'+
      '<rect x="45" width="15" height="40" fill="#D52B1E"/>'+
      '<path d="M30,6 l2.3,4.8 4.7,-1 -1.4,4.6 5.4,-1.7 -1.7,3.2 4.8,3.5 -1.7,1 1,3.5 -5.6,-1.1 -0.6,2.3 -4.5,-4.8 1,8.2 -2.7,-1.2 -0.5,-2 -0.5,2 -2.7,1.2 1,-8.2 -4.5,4.8 -0.6,-2.3 -5.6,1.1 1,-3.5 -1.7,-1 4.8,-3.5 -1.7,-3.2 5.4,1.7 -1.4,-4.6 4.7,1 z" fill="#D52B1E"/>';},
  mx:function(){return vbands(['#006847','#ffffff','#CE1126'])+
      '<circle cx="30" cy="20" r="5" fill="#8DBE3F" opacity=".75"/><circle cx="30" cy="20" r="2.6" fill="#8B5A2B"/>';},
  kr:function(){return '<rect width="60" height="40" fill="#fff"/>'+
      '<circle cx="30" cy="20" r="8.5" fill="#0047A0"/>'+
      '<path d="M21.5,20 A8.5,8.5 0 0,1 38.5,20 Z" fill="#CD2E3A"/>'+
      '<circle cx="25.75" cy="20" r="4.25" fill="#CD2E3A"/><circle cx="34.25" cy="20" r="4.25" fill="#0047A0"/>'+
      '<g fill="#000"><rect x="6" y="7" width="8" height="1.3"/><rect x="6" y="9.4" width="8" height="1.3"/><rect x="6" y="11.8" width="8" height="1.3"/>'+
      '<rect x="46" y="7" width="8" height="1.3"/><rect x="46" y="9.4" width="8" height="1.3"/><rect x="46" y="11.8" width="8" height="1.3"/>'+
      '<rect x="6" y="27" width="8" height="1.3"/><rect x="6" y="29.4" width="8" height="1.3"/><rect x="6" y="31.8" width="8" height="1.3"/>'+
      '<rect x="46" y="27" width="8" height="1.3"/><rect x="46" y="29.4" width="8" height="1.3"/><rect x="46" y="31.8" width="8" height="1.3"/></g>';},
  th:function(){return '<rect width="60" height="40" fill="#A51931"/><rect y="6.6" width="60" height="26.8" fill="#fff"/>'+

function shade(hex,pct){
  var n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  r=Math.round(r+(255-r)*pct/100); g=Math.round(g+(255-g)*pct/100); b=Math.round(b+(255-b)*pct/100);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function flower(spec){
  var p=spec.split(','), shape=p[0], n=+p[1], pc=p[2], cc=p[3], s='', i, a, cx, cy;
  if(shape==='maple') return '<g transform="translate(30,32) scale(1.55) translate(-30,-18)">'+MAPLE+' fill="'+pc+'"/></g>';
  if(shape==='puff'){
    for(i=0;i<12;i++){ a=i*30*Math.PI/180; var rr=(i%2?9:13);
      s+='<circle cx="'+(30+rr*Math.cos(a)).toFixed(1)+'" cy="'+(30+rr*Math.sin(a)).toFixed(1)+'" r="4.3" fill="'+pc+'"/>'; }
    return s+'<circle cx="30" cy="30" r="7" fill="'+cc+'"/>';
  }
  if(shape==='many'){
    [[17,pc],[11.5,shade(pc,16)],[6.5,shade(pc,32)]].forEach(function(ring,ri){
      for(var k=0;k<n;k++){
        var ang=(k*360/n)+(ri*18), rd=(ang-90)*Math.PI/180;
        cx=30+ring[0]*0.60*Math.cos(rd); cy=30+ring[0]*0.60*Math.sin(rd);
        s+='<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+(ring[0]*0.52).toFixed(1)+'" ry="'+(ring[0]*0.40).toFixed(1)+
           '" fill="'+ring[1]+'" transform="rotate('+ang.toFixed(0)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')"/>';
      }
    });
    return s+'<circle cx="30" cy="30" r="4.6" fill="'+cc+'"/>';
  }
  for(i=0;i<n;i++){
    a=i*360/n; var rad=(a-90)*Math.PI/180;
    cx=30+13*Math.cos(rad); cy=30+13*Math.sin(rad);
    s+='<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+(shape==='point'?5:7.2)+'" ry="'+(shape==='point'?11:8.4)+
       '" fill="'+pc+'" transform="rotate('+a+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')"/>';
  }
  return s+'<circle cx="30" cy="30" r="6" fill="'+cc+'"/>';
}

var cv=document.getElementById('globe'), ctx=cv.getContext('2d');
var rot={lon:100,lat:15}, target=null, spinning=true, dragging=false, last=null;
var MODE='learn', huntReveal=false;
var W=0,H=0,CX=0,CY=0,RR=0, dots=[];

function resize(){
  var box=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  var size=Math.max(240, Math.min(box.width, 520));
  cv.width=size*dpr; cv.height=size*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W=size;H=size;CX=size/2;CY=size/2;RR=size/2-10;
}
window.addEventListener('resize',function(){resize();});

function project(lon,lat){
  var p=lat*Math.PI/180, l=lon*Math.PI/180;
  var p0=rot.lat*Math.PI/180, l0=rot.lon*Math.PI/180;
  var cosc=Math.sin(p0)*Math.sin(p)+Math.cos(p0)*Math.cos(p)*Math.cos(l-l0);
  var x=RR*Math.cos(p)*Math.sin(l-l0);
  var y=RR*(Math.cos(p0)*Math.sin(p)-Math.sin(p0)*Math.cos(p)*Math.cos(l-l0));
  return {x:CX+x, y:CY-y, vis:cosc>0};
}
function densify(poly){
  var out=[];
  for(var i=0;i<poly.length-1;i++){
    var a=poly[i], b=poly[i+1];
    for(var t=0;t<1;t+=0.14) out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
  }
  out.push(poly[poly.length-1]);
  return out;
}
var LAND_D=LAND.map(densify);

function draw(){
  ctx.clearRect(0,0,W,H);
  // ocean
  var g=ctx.createRadialGradient(CX-RR*0.35,CY-RR*0.4,RR*0.1,CX,CY,RR);
  g.addColorStop(0,'#8fd0ff'); g.addColorStop(1,'#1f7ac9');
  ctx.beginPath(); ctx.arc(CX,CY,RR,0,7); ctx.fillStyle=g; ctx.fill();
  // graticule
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1;
  for(var la=-60;la<=60;la+=30){
    ctx.beginPath(); var started=false;
    for(var lo=-180;lo<=180;lo+=4){ var p=project(lo,la); if(p.vis){ started?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); started=true; } else started=false; }
    ctx.stroke();
  }
  for(var lo2=-180;lo2<180;lo2+=30){
    ctx.beginPath(); var st2=false;
    for(var la2=-90;la2<=90;la2+=4){ var q=project(lo2,la2); if(q.vis){ st2?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); st2=true; } else st2=false; }
    ctx.stroke();
  }
  // land
  ctx.fillStyle='#5ec46f'; ctx.strokeStyle='#3a9c4d'; ctx.lineWidth=1;
  LAND_D.forEach(function(poly){
    var run=[];
    poly.forEach(function(pt){
      var p=project(pt[0],pt[1]);
      if(p.vis) run.push(p);
      else { if(run.length>2) paint(run); run=[]; }
    });
    if(run.length>2) paint(run);
  });
  function paint(run){
    ctx.beginPath(); ctx.moveTo(run[0].x,run[0].y);
    for(var i=1;i<run.length;i++) ctx.lineTo(run[i].x,run[i].y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // shine + edge
  ctx.beginPath(); ctx.arc(CX,CY,RR,0,7);
  var sh=ctx.createRadialGradient(CX-RR*0.4,CY-RR*0.45,RR*0.05,CX,CY,RR*1.15);
  sh.addColorStop(0,'rgba(255,255,255,.35)'); sh.addColorStop(.45,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(0,20,50,.35)');
  ctx.fillStyle=sh; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle='#ffffff'; ctx.stroke();

  // country dots
  dots=[];
  COUNTRIES.forEach(function(c){
    var p=project(c.lon,c.lat);
    if(!p.vis) return;
    dots.push({x:p.x,y:p.y,c:c});
    var sel = c.id===current.id;
    ctx.beginPath(); ctx.arc(p.x,p.y,sel?0:3.5,0,7);
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(20,60,100,.6)'; ctx.stroke();
  });
  // selected pin
  var pp=project(current.lon,current.lat);
  if(pp.vis && (MODE!=='hunt' || huntReveal)){
    var bob=Math.sin(Date.now()/260)*3;
    var y=pp.y-4+bob;
    ctx.beginPath();
    ctx.moveTo(pp.x, pp.y+2);
    ctx.quadraticCurveTo(pp.x-11, y-14, pp.x, y-22);
    ctx.quadraticCurveTo(pp.x+11, y-14, pp.x, pp.y+2);
    ctx.fillStyle='#ff4d6d'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.beginPath(); ctx.arc(pp.x,y-14,4.2,0,7); ctx.fillStyle='#fff'; ctx.fill();
    var label = document.body.classList.contains('only-en') ? current.en : current.zh;
    ctx.font='bold 15px "Segoe UI","PingFang SC",sans-serif';
    var tw=ctx.measureText(label).width;
    ctx.fillStyle='rgba(255,255,255,.95)';
    roundRect(pp.x-tw/2-8, y-46, tw+16, 24, 12); ctx.fill();
    ctx.fillStyle='#1f3b57'; ctx.textAlign='center'; ctx.fillText(label, pp.x, y-29);
    ctx.textAlign='start';
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function shortest(a,b){ var d=(b-a)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; }
function tick(){
  if(target){
    rot.lon += shortest(rot.lon,target.lon)*0.09;
    rot.lat += (target.lat-rot.lat)*0.09;
    if(Math.abs(shortest(rot.lon,target.lon))<0.4 && Math.abs(target.lat-rot.lat)<0.4){ rot.lon=target.lon; rot.lat=target.lat; target=null; }
  } else if(spinning && !dragging){
    rot.lon+=0.25;
  }
  if(rot.lon>180)rot.lon-=360; if(rot.lon<-180)rot.lon+=360;
  draw();
  requestAnimationFrame(tick);
}
function flyTo(c){ target={lon:c.lon, lat:Math.max(-60,Math.min(60,c.lat))}; }

cv.addEventListener('pointerdown',function(e){
  dragging=true; last={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId);
  cv._moved=0;
});
cv.addEventListener('pointermove',function(e){
  if(!dragging) return;
  var dx=e.clientX-last.x, dy=e.clientY-last.y;
  cv._moved += Math.abs(dx)+Math.abs(dy);
  rot.lon -= dx*0.4; rot.lat += dy*0.4;
  rot.lat=Math.max(-85,Math.min(85,rot.lat));
  target=null; last={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointerup',function(e){
  dragging=false;
  if(cv._moved<6){
    var r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    var best=null,bd=24;
    dots.forEach(function(d){ var dd=Math.hypot(d.x-mx,d.y-my); if(dd<bd){bd=dd;best=d.c;} });
    if(best){ if(MODE==='hunt') huntPick(best); else select(best.id,true); }
  }
});

  var c=current;
  var html='<div class="cardTop">'+
    '<div class="flagBox">'+flagSVG(c.id)+'</div>'+
    '<div><div class="cName stack">'+T(c.zh,c.en)+'</div>'+
    '<div class="meta stack">'+T('首都：'+c.capZh,'Capital: '+c.capEn)+'</div></div></div>';
  html+='<ul class="facts">';
  c.f.forEach(function(f){
    html+='<li><span class="emo">'+f[0]+'</span><span class="stack">'+T(f[1],f[2])+'</span></li>';
  });
  html+='</ul>';
  var x=EXTRA[c.id];
  html+='<div class="trio">'+
    '<button data-s="lm"><div class="lbl stack">'+T('🏛️ 地标','🏛️ LANDMARK')+'</div>'+lmSVG(x.lm[0])+
      '<div class="nm stack">'+T(x.lm[1],x.lm[2])+'</div></button>'+
    '<button data-s="an"><div class="lbl stack">'+T('🐾 代表动物','🐾 ANIMAL')+'</div><div class="emo">'+x.an[0]+'</div>'+
      '<div class="nm stack">'+T(x.an[1],x.an[2])+'</div></button>'+
    '<button data-s="fl"><div class="lbl stack">'+T('🌸 国花','🌸 FLOWER')+'</div>'+flSVG(x.fl[0])+
      '<div class="nm stack">'+T(x.fl[1],x.fl[2])+'</div></button>'+
    '</div>';
  html+='<div class="hello stack">'+T('打招呼要说：<b>'+c.hi+'</b>（'+c.hiR+'）','Say hello: <b>'+c.hi+'</b> ('+c.hiR+')')+'</div>';
  html+='<div class="navRow">'+
    '<button class="btn" id="prevB">⬅️ '+T('上一个','Back')+'</button>'+
    '<button class="btn" id="sayB">🔊 '+T('读给我听','Say it')+'</button>'+
    '<button class="btn" id="nextB">'+T('下一个','Next')+' ➡️</button></div>';
  document.getElementById('card').innerHTML=html;
  document.getElementById('prevB').onclick=function(){ step(-1); };
  document.getElementById('nextB').onclick=function(){ step(1); };
  document.getElementById('sayB').onclick=speak;
  Array.prototype.forEach.call(document.querySelectorAll('.trio button'),function(b){
    b.onclick=function(){ var d=EXTRA[current.id][b.dataset.s]; say(d[1],d[2],true); };
  });
}
function step(d){
  var i=COUNTRIES.indexOf(current);
  select(COUNTRIES[(i+d+COUNTRIES.length)%COUNTRIES.length].id, true);
}
var autoSpeak=true;
function say(zh,en,force){
  if(!window.speechSynthesis) return;
  if(!autoSpeak && !force) return;
  speechSynthesis.cancel();
  var cl=document.body.className;
  function utter(txt,lang){
    if(!txt) return;
    var u=new SpeechSynthesisUtterance(String(txt).replace(/<[^>]*>/g,''));
    u.lang=lang; u.rate=0.85; speechSynthesis.speak(u);
  }
  if(cl.indexOf('only-en')<0) utter(zh,'zh-CN');
  if(cl.indexOf('only-zh')<0) utter(en,'en-US');
}
function speak(){ say(current.zh, current.en, true); }
function select(id,user){
  current=COUNTRIES.filter(function(c){return c.id===id;})[0];
  renderCard(); flyTo(current); markGrid();
  if(user){ addStamp(current.id); say(current.zh, current.en); }
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=CONTINENTS.map(function(t){
    return '<button class="btn'+(t.id===filter?' on':'')+'" data-c="'+t.id+'">'+T(t.zh,t.en)+'</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .btn'),function(b){
    b.onclick=function(){ filter=b.dataset.c; renderTabs(); renderGrid(); };
  });
}
function renderGrid(){
  var list=COUNTRIES.filter(function(c){return filter==='all'||c.c===filter;});
  document.getElementById('grid').innerHTML=list.map(function(c){
    return '<button class="cbtn" data-id="'+c.id+'">'+flagSVG(c.id)+'<span class="stack">'+T(c.zh,c.en)+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#grid .cbtn'),function(b){
    b.onclick=function(){ select(b.dataset.id, true); };
  });

}
function markGrid(){

}
Array.prototype.forEach.call(document.querySelectorAll('#langSeg .btn'),function(b){

var MODES=['learn','hunt','animal','quiz','passport'];
function setMode(m){
  MODES.forEach(function(x){ document.body.classList.remove('m-'+x); });
  document.body.classList.add('m-'+m);
  MODE=m; huntReveal=false;
  Array.prototype.forEach.call(document.querySelectorAll('#modeNav .btn'),function(b){
    b.classList.toggle('on', b.dataset.m===m);
  });
  if(m==='hunt') startHunt();
  if(m==='quiz') startQuiz();
  if(m==='animal') startAnimal();

Array.prototype.forEach.call(document.querySelectorAll('#modeNav .btn[data-m]'),function(b){

document.getElementById('spkBtn').onclick=function(){

  this.classList.toggle('on',autoSpeak);

document.getElementById('spinBtn').onclick=function(){

/* ============================================================
   6. QUIZ
   ============================================================ */
var qList=[], qIdx=0, qScore=0;
function startQuiz(){
  var pool=COUNTRIES.slice();
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  qList=pool.slice(0,8).map(function(c){
    var opts=[c], others=COUNTRIES.filter(function(x){return x.id!==c.id;});
    while(opts.length<4){
      var pick=others[Math.floor(Math.random()*others.length)];
      if(opts.indexOf(pick)<0) opts.push(pick);
    }
    for(var k=opts.length-1;k>0;k--){ var m=Math.floor(Math.random()*(k+1)); var tmp=opts[k]; opts[k]=opts[m]; opts[m]=tmp; }
    return {ans:c, opts:opts};
  });
  qIdx=0; qScore=0; renderQuiz();
}
function renderQuiz(){
  var box=document.getElementById('quiz');
  if(qIdx>=qList.length){
    var msg = qScore===qList.length ? T('太棒了！全部答对！🏆','Perfect! You got them all! 🏆')
            : qScore>=qList.length-2 ? T('很厉害！继续加油！🌟','Great job! Keep going! 🌟')
            : T('不错哦，再玩一次会更棒！💪','Nice try — play again! 💪');
    box.innerHTML='<div class="bigMsg stack">'+msg+'</div>'+
      '<div class="bigMsg score">'+qScore+' / '+qList.length+'</div>'+
      '<div style="text-align:center"><button class="btn big" id="againB">🔁 '+T('再玩一次','Play again')+'</button> '+
      '<button class="btn" id="backB">📚 '+T('回去学习','Back to learning')+'</button></div>';
    document.getElementById('againB').onclick=startQuiz;
    document.getElementById('backB').onclick=exitQuiz;
    return;
  }
  var q=qList[qIdx];
  box.innerHTML='<div class="qHead"><div class="qTitle stack">'+
      T('第 '+(qIdx+1)+' 题：哪一面是「'+q.ans.zh+'」的国旗？','Q'+(qIdx+1)+': Which flag belongs to '+q.ans.en+'?')+'</div>'+
      '<div class="grow"></div><div class="score">⭐ '+qScore+'</div>'+
      '<button class="btn" id="backB">📚 '+T('回去学习','Back')+'</button></div>'+
    '<div class="qOpts">'+q.opts.map(function(o){
      return '<button class="qOpt" data-id="'+o.id+'">'+flagSVG(o.id)+'<span class="stack">'+T(o.zh,o.en)+'</span></button>';
    }).join('')+'</div>';
  document.getElementById('backB').onclick=exitQuiz;
  say('哪一面是'+q.ans.zh+'的国旗', 'Which flag belongs to '+q.ans.en);
  Array.prototype.forEach.call(box.querySelectorAll('.qOpt'),function(b){
    b.onclick=function(){
      if(box._locked) return; box._locked=true;
      var ok=b.dataset.id===q.ans.id;
      if(ok){ qScore++; b.classList.add('right'); }
      else{
        b.classList.add('wrong');
        var right=box.querySelector('.qOpt[data-id="'+q.ans.id+'"]');
        if(right) right.classList.add('right');
      }
      setTimeout(function(){ box._locked=false; qIdx++; renderQuiz(); }, ok?700:1400);
    };
  });
}
function exitQuiz(){ setMode('learn'); }

/* ============================================================
   6b. CONFETTI
   ============================================================ */
var cfC=document.getElementById('confetti'), cfX=cfC.getContext('2d'), parts=[], cfOn=false;
function cfResize(){ cfC.width=window.innerWidth; cfC.height=window.innerHeight; }
window.addEventListener('resize',cfResize); cfResize();
function burst(n){
  n=n||80;
  var cols=['#ff7eb6','#ffc93c','#3ec46d','#3d8bfd','#ff9a3c'];
  for(var i=0;i<n;i++) parts.push({
    x:window.innerWidth/2+(Math.random()-.5)*300, y:window.innerHeight*0.34,
    vx:(Math.random()-.5)*10, vy:-Math.random()*12-3, s:5+Math.random()*7,
    c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*.45});
  if(!cfOn){ cfOn=true; cfC.style.display='block'; cfLoop(); }
}
function cfLoop(){
  cfX.clearRect(0,0,cfC.width,cfC.height);
  parts=parts.filter(function(p){ return p.y<cfC.height+40; });
  parts.forEach(function(p){
    p.vy+=0.32; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    cfX.save(); cfX.translate(p.x,p.y); cfX.rotate(p.r);
    cfX.fillStyle=p.c; cfX.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cfX.restore();
  });
  if(parts.length) requestAnimationFrame(cfLoop);
  else { cfOn=false; cfC.style.display='none'; }
}

/* ============================================================
   6c. PASSPORT (stamp collection, saved in the browser)
   ============================================================ */
var PKEY='we_passport_v1', passport={};
try{ passport=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}; }catch(e){ passport={}; }
function savePassport(){ try{ localStorage.setItem(PKEY,JSON.stringify(passport)); }catch(e){} }
function stampCount(){ var n=0; for(var k in passport) if(passport[k]) n++; return n; }
function updateBadge(){ document.getElementById('ppCount').textContent=stampCount()+'/'+COUNTRIES.length; }
function addStamp(id){
  if(passport[id]) return false;
  passport[id]=1; savePassport(); updateBadge(); showStampFx(id);
  if(document.body.classList.contains('m-passport')) renderPassport();
  if(stampCount()===COUNTRIES.length) setTimeout(function(){ burst(180); }, 1000);
  return true;
}
var fxTimer=null;
function showStampFx(id){
  var c=COUNTRIES.filter(function(x){return x.id===id;})[0], box=document.getElementById('stampFx');
  box.innerHTML='<div class="big">'+flagSVG(id)+'<div class="t stack">'+T(c.zh+'<br>盖章成功！',c.en+'<br>Stamped!')+'</div></div>';
  box.classList.add('show');
  clearTimeout(fxTimer);
  fxTimer=setTimeout(function(){ box.classList.remove('show'); }, 1300);
}
function renderPassport(){
  var n=stampCount(), tot=COUNTRIES.length, box=document.getElementById('passport');
  var h='<div class="qHead"><div class="qTitle stack">'+T('🛂 我的环游世界护照','🛂 My World Passport')+
        '</div><div class="grow"></div><div class="score">'+n+' / '+tot+'</div></div>'+
        '<div class="bar"><i style="width:'+(n/tot*100)+'%"></i></div>'+
        '<p class="hint stack">'+T('每认识一个新国家，护照上就会盖一个章！','Meet a new country and earn a stamp!')+'</p>';
  if(n===tot) h+='<div class="cert"><div class="big">🏆</div><div class="t stack">'+
      T('恭喜你！你已经环游世界一圈了！','Congratulations! You have travelled the whole world!')+'</div></div>';
  h+='<div class="pp">'+COUNTRIES.map(function(c){
      return passport[c.id]
        ? '<div class="slot got"><div class="stampImg"><div class="ring"></div>'+flagSVG(c.id)+'</div><div class="nm stack">'+T(c.zh,c.en)+'</div></div>'
        : '<div class="slot"><div class="q">?</div><div class="nm stack">'+T('还没去过','Not yet')+'</div></div>';
    }).join('')+'</div>';
  h+='<div style="text-align:center;margin-top:16px"><button class="btn" id="ppReset">🧹 '+T('清空重来','Clear all stamps')+'</button></div>';
  box.innerHTML=h;
  document.getElementById('ppReset').onclick=function(){
    var ask=document.body.classList.contains('only-en')?'Clear all stamps and start over?':'确定要清空所有印章，重新开始吗？';
    if(window.confirm(ask)){ passport={}; savePassport(); updateBadge(); renderPassport(); }
  };
}

/* ============================================================
   6d. GLOBE HUNT — "find Japan!"
   ============================================================ */
var hunt={target:null,tries:0,round:0,score:0,n:6,done:false};
function startHunt(){ hunt.round=0; hunt.score=0; nextHunt(); }
function nextHunt(){
  hunt.round++;
  if(hunt.round>hunt.n){ renderHuntEnd(); return; }
  hunt.target=COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];
  hunt.tries=0; hunt.done=false; huntReveal=false;
  rot.lon=hunt.target.lon+110+Math.random()*140; rot.lat=8; target=null;
  renderHunt('');
  say('找到 '+hunt.target.zh, 'Find '+hunt.target.en);
}
function renderHunt(hintHtml, good){
  var t=hunt.target;
  document.getElementById('huntPanel').innerHTML=
    '<div class="qHead"><div class="score">🎯 '+hunt.round+' / '+hunt.n+'</div><div class="grow"></div>'+
      '<div class="score">⭐ '+hunt.score+'</div></div>'+
    '<div class="huntQ stack">'+T('在地球上找到<br>'+t.zh+'！','Find <br>'+t.en+' on the globe!')+'</div>'+
    flagSVG(t.id,'huntFlag')+
    '<div class="hintBox stack'+(good?' good':'')+'">'+(hintHtml||T('转动地球，点一点你觉得对的小白点 👆','Spin the globe and tap the dot you think is right 👆'))+'</div>';
}
function huntPick(c){
  if(hunt.done) return;
  var t=hunt.target;
  if(c.id===t.id){
    hunt.done=true; hunt.score += (hunt.tries===0?2:1);
    huntReveal=true; current=t; flyTo(t); burst(90); addStamp(t.id);
    renderHunt(T('太棒了！找到'+t.zh+'了！ 🎉','Brilliant! You found '+t.en+'! 🎉'), true);
    say('太棒了！这里是'+t.zh, 'Brilliant! This is '+t.en);
    setTimeout(function(){ huntReveal=false; nextHunt(); }, 2400);
    return;
  }
  hunt.tries++;
  var cont=CONTINENTS.filter(function(x){return x.id===t.c;})[0];
  var zh='不对哦～ 它在<b>'+cont.zh+'</b>', en='Not quite — it is in <b>'+cont.en+'</b>';
  var dx=shortest(c.lon,t.lon), dy=t.lat-c.lat;
  if(dx>15){ zh+='，往<b>东边（右边）</b>找'; en+=', look further <b>east (right)</b>'; }
  else if(dx<-15){ zh+='，往<b>西边（左边）</b>找'; en+=', look further <b>west (left)</b>'; }
  if(dy>15){ zh+='，再往<b>北</b>一点'; en+=', and further <b>north</b>'; }
  else if(dy<-15){ zh+='，再往<b>南</b>一点'; en+=', and further <b>south</b>'; }
  if(hunt.tries>=3){
    hunt.done=true; zh+='。<br>看，它就在这里！'; en+='.<br>Look — here it is!';
    huntReveal=true; current=t; flyTo(t);
    renderHunt(T(zh,en));
    say('看，这里就是'+t.zh, 'Look, here is '+t.en);
    setTimeout(function(){ huntReveal=false; nextHunt(); }, 3000);
    return;
  }
  renderHunt(T(zh,en));
}
function renderHuntEnd(){
  var msg = hunt.score>=10 ? T('你是地球小博士！🏆','You are a globe expert! 🏆')
          : hunt.score>=6  ? T('很棒！再来一次会更快！🌟','Great! Try again and be even faster! 🌟')
          : T('地球好大呀，再玩一次就熟啦！💪','The Earth is big — play again! 💪');
  if(hunt.score>=10) burst(140);
  document.getElementById('huntPanel').innerHTML=
    '<div class="bigMsg stack">'+msg+'</div><div class="bigMsg score">⭐ '+hunt.score+'</div>'+
    '<div style="text-align:center"><button class="btn big" id="hAgain">🔁 '+T('再玩一次','Play again')+'</button> '+
    '<button class="btn" id="hBack">📚 '+T('回去学习','Back')+'</button></div>';
  document.getElementById('hAgain').onclick=startHunt;
  document.getElementById('hBack').onclick=function(){ setMode('learn'); };
}

/* ============================================================
   6e. ANIMAL MATCH — put each animal back in its home country
   ============================================================ */
var ANIMALS=[
  {e:'🐼',zh:'大熊猫',en:'Panda',id:'cn'},
  {e:'🦘',zh:'袋鼠',en:'Kangaroo',id:'au'},
  {e:'🦁',zh:'狮子',en:'Lion',id:'ke'},
  {e:'🐘',zh:'大象',en:'Elephant',id:'th'},
  {e:'🦧',zh:'红毛猩猩',en:'Orangutan',id:'my'},
  {e:'🐦',zh:'奇异鸟',en:'Kiwi bird',id:'nz'},
  {e:'🦎',zh:'科莫多龙',en:'Komodo dragon',id:'id'},
  {e:'🦅',zh:'白头鹰',en:'Bald eagle',id:'us'},
  {e:'🐫',zh:'骆驼',en:'Camel',id:'eg'},
  {e:'🐅',zh:'老虎',en:'Tiger',id:'in'},
  {e:'🐻',zh:'棕熊',en:'Brown bear',id:'ru'},
  {e:'🦫',zh:'河狸',en:'Beaver',id:'ca'}
];
var am={round:0,n:3,per:4,pool:[],pairs:[],selA:null,selC:null,left:0,score:0};
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function startAnimal(){ am.round=0; am.score=0; am.pool=shuffle(ANIMALS.slice()); nextAnimal(); }
function nextAnimal(){
  am.round++;
  if(am.round>am.n){ renderAnimalEnd(); return; }
  am.pairs=am.pool.slice((am.round-1)*am.per, am.round*am.per);
  am.selA=null; am.selC=null; am.left=am.pairs.length;
  renderAnimal('');
}
function renderAnimal(msg){
  var animals=shuffle(am.pairs.slice()), homes=shuffle(am.pairs.slice());
  var h='<div class="qHead"><div class="qTitle stack">'+T('🐾 帮小动物找到家','🐾 Take each animal home')+
        '</div><div class="grow"></div><div class="score">'+am.round+' / '+am.n+'</div>'+
        '<div class="score">⭐ '+am.score+'</div></div>'+
        '<p class="hint stack">'+T('先点一只动物，再点它住的国家 👆','Tap an animal, then tap the country it lives in 👆')+'</p>'+
        '<div class="hintBox stack" id="amMsg">'+(msg||T('它们迷路啦，快帮帮它们！','They are lost — please help them!'))+'</div>'+
        '<div class="matchWrap"><div class="col">'+
        animals.map(function(a){ return '<button class="mcard a" data-id="'+a.id+'"><span class="ani">'+a.e+
          '</span><span class="stack">'+T(a.zh,a.en)+'</span></button>'; }).join('')+
        '</div><div class="col">'+
        homes.map(function(a){ var c=COUNTRIES.filter(function(x){return x.id===a.id;})[0];
          return '<button class="mcard c" data-id="'+a.id+'">'+flagSVG(a.id)+'<span class="stack">'+T(c.zh,c.en)+'</span></button>'; }).join('')+
        '</div></div>';
  var box=document.getElementById('animal');
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('.mcard'),function(b){
    b.onclick=function(){ pickCard(b, b.classList.contains('a')); };
  });
  am.matched={};
}
function pickCard(el, isAnimal){
  var box=document.getElementById('animal');
  if(isAnimal){
    if(am.selA) am.selA.classList.remove('sel');
    am.selA=el; el.classList.add('sel');
  } else {
    if(am.selC) am.selC.classList.remove('sel');
    am.selC=el; el.classList.add('sel');
  }
  if(!am.selA || !am.selC) return;
  var a=am.selA, c=am.selC;
  if(a.dataset.id===c.dataset.id){
    var an=ANIMALS.filter(function(x){return x.id===a.dataset.id;})[0];
    var co=COUNTRIES.filter(function(x){return x.id===a.dataset.id;})[0];
    a.classList.remove('sel'); c.classList.remove('sel');
    a.classList.add('done'); c.classList.add('done');
    am.selA=null; am.selC=null; am.score++; am.left--;
    addStamp(co.id);
    document.getElementById('amMsg').innerHTML=T(
      an.e+' <b>'+an.zh+'</b> 住在 <b>'+co.zh+'</b>，回家啦！',
      an.e+' The <b>'+an.en.toLowerCase()+'</b> lives in <b>'+co.en+'</b> — home at last!');
    document.getElementById('amMsg').classList.add('good');
    say(an.zh+'住在'+co.zh, 'The '+an.en.toLowerCase()+' lives in '+co.en);
    if(am.left===0){ burst(80); setTimeout(nextAnimal, 1600); }
  } else {
    a.classList.add('shake'); c.classList.add('shake');
    var aa=a, cc=c;
    setTimeout(function(){
      aa.classList.remove('shake','sel'); cc.classList.remove('shake','sel');
    }, 420);
    am.selA=null; am.selC=null;
    var m=document.getElementById('amMsg');
    m.classList.remove('good');
    m.innerHTML=T('这不是它的家哦，再试试看 🤔','That is not its home — try again 🤔');
  }
}
function renderAnimalEnd(){
  burst(140);
  document.getElementById('animal').innerHTML=
    '<div class="bigMsg stack">'+T('全部小动物都回家啦！🎉','Every animal is home! 🎉')+'</div>'+
    '<div class="bigMsg score">⭐ '+am.score+' / '+ANIMALS.length+'</div>'+
    '<div style="text-align:center"><button class="btn big" id="aAgain">🔁 '+T('再玩一次','Play again')+'</button> '+
    '<button class="btn" id="aBack">📚 '+T('回去学习','Back')+'</button></div>';
  document.getElementById('aAgain').onclick=startAnimal;
  document.getElementById('aBack').onclick=function(){ setMode('learn'); };
}

/* ============================================================
   7. GO
   ============================================================ */
document.body.classList.add('m-learn');
resize(); renderTabs(); renderGrid(); renderCard(); updateBadge(); flyTo(current); tick();
setTimeout(resize, 60);
</script>
